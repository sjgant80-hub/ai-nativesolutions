name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: proof-of-play — the operating-board gate
        run: node --test stages.test.mjs
      - name: the front door runs the estate's real kernels, byte for byte (pinned by hash)
        run: node scripts/vendor-site.mjs --check
      - name: the front door's own kernels — tests
        run: node --test site/kernel/estate.test.mjs site/kernel/ground.test.mjs site/kernel/netwatch.test.mjs site/kernel/race.test.mjs site/page.test.mjs site/front.test.mjs
      - name: the front door is drawn from its records (fixpoint)
        run: node scripts/build-front.mjs --check
      - name: the film package is drawn from its facts file (fixpoint)
        run: |
          node scripts/build-explainer.mjs
          node scripts/build-edition.mjs
          git diff --exit-code explainer.html prospectus.html deck.html index.html deep.html
      - name: surface gate — no own pricing, credits present, proof language narrow-true, figures match facts, links resolve
        run: node scripts/surface-gate.mjs
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate stages.mjs --timeout 60000 --cap 400 --test node --test stages.test.mjs
      - name: witness — the front door's kernels, broken on purpose, re-derived on this runner
        run: node scripts/gate-site.mjs /tmp/witness/witness.mjs --verify
      - name: the agent face — tests, and every agent-readable file is exactly what its records give
        run: |
          node --test agent/kernel.test.mjs
          node scripts/build-agent.mjs --check
      - name: witness — the agent face's kernel, broken on purpose; every break must be caught
        run: |
          node /tmp/witness/witness.mjs mutate agent/kernel.mjs --timeout 60000 --cap 100000 --test node --test agent/kernel.test.mjs > agent-gate.out 2>&1 || true
          node -e "const b=require('fs').readFileSync('agent-gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true||j.killed!==j.total||!(j.total>0)){console.error('::error::witness not clean on agent/kernel.mjs: '+j.killed+'/'+j.total);process.exit(1)}console.log('witness CLEAN agent/kernel.mjs '+j.killed+'/'+j.total)"
