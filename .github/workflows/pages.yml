name: pages

# ⚑ WHY THIS EXISTS. offerings.html was pushed, was on GitHub, and never appeared on the site.
# Legacy branch-deploy did not run a build for the commit and reported nothing anywhere — no failed
# run, no error, just the previous version still being served. A deploy that silently does not
# happen is worse than one that fails loudly, so this makes it an explicit job that shows up in the
# Actions tab and can go red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
