<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own it. Prove it. — the FallForge film</title>
<style>

<body>
<div id="stage"><canvas id="c" width="1920" height="1080" aria-label="Own it. Prove it. — a 90-second film about FallForge and the sovereign estate"></canvas>
<button id="play" aria-label="Play the film with sound"><span>▶ Play the film (90s, with sound)</span></button></div>
<script type="module">
const W = 1920, H = 1080, FPS = 30;
const C = { bg:'#0b0a0f', bg2:'#100d15', card:'#141218', ink:'#e2d9c8', gold:'#d4a017', gold2:'#ffb648', line:'#2b251f', soft:'#8f8778', good:'#5fbf7f', bad:'#e06a5f', amber:'#e3a43b' };
const SERIF = 'Georgia, "Iowan Old Style", serif', SANS = '"Segoe UI", system-ui, sans-serif', MONO = 'Consolas, "Cascadia Mono", monospace';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const q = new URLSearchParams(location.search);

// ── data: the ONE source of numbers, and the voice-timed timeline ────────────────────────────────
const [F, TL] = await Promise.all([fetch(new URLSearchParams(location.search).get('facts') || 'facts.json').then(r => r.json()), fetch('timeline.json').then(r => r.json())]);
const IMG = {};
const shotNames = ['fallforgemint-sizer', 'fallforgemint-verify', 'fallforgemint-rerun', 'fallforgemint-get', 'fall-os', 'capability-router', 'sovereign-foundry', 'witness'];
await Promise.all(shotNames.map(n => new Promise((res) => { const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => res(); im.src = 'shots/' + n + '.png'; })));

// ── helpers ───────────────────────────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (x, a, b) => clamp((x - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

}
function txt(s, x, y, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.font = o.font || ('36px ' + SERIF); ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  if (o.grad) { const m = ctx.measureText(s).width, x0 = o.align === 'center' ? x - m / 2 : x; const g = ctx.createLinearGradient(x0, 0, x0 + m, 0); g.addColorStop(0, C.gold); g.addColorStop(1, C.gold2); ctx.fillStyle = g; }
  ctx.fillText(s, x, y); const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrap(s, x, y, maxW, lh, o = {}) {
  ctx.save(); ctx.font = o.font || ('32px ' + SERIF); const words = s.split(' '); let line = '', yy = y; const lines = [];
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); ctx.restore();
  for (const l of lines) { txt(l, x, yy, o); yy += lh; } return lines.length;
}
function pill(s, x, y, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.font = o.font || ('600 24px ' + SANS); const w = ctx.measureText(s).width + (o.pad ?? 28) * 2, h = o.h || 48;
  const x0 = o.align === 'center' ? x - w / 2 : (o.align === 'right' ? x - w : x);
  rr(x0, y - h / 2, w, h, h / 2); ctx.fillStyle = o.bg || 'rgba(212,160,23,.12)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = o.color || C.gold; ctx.stroke();
  ctx.fillStyle = o.color || C.gold; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(s, x0 + w / 2, y + 1); ctx.restore(); return w;
}
function eyebrow(s, x, y, a = 1) { txt(s.toUpperCase(), x, y, { font: '600 22px ' + SANS, color: C.gold, alpha: a }); }
function shot(name, x, y, w, h, o = {}) {
  const im = IMG[name]; if (!im) return;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; rr(x, y, w, h, o.r ?? 16); ctx.fillStyle = C.card; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.clip();
  const z = o.zoom ?? 1, sw = im.width / z, sh = sw * h / w, sx = clamp((im.width - sw) * (o.px ?? 0), 0, im.width - sw), sy = clamp((im.height - sh) * (o.py ?? 0), 0, Math.max(0, im.height - sh));
  ctx.drawImage(im, sx, sy, sw, Math.min(sh, im.height - sy), x, y, w, Math.min(h, (im.height - sy) * w / sw));
  ctx.restore(); ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); rr(x, y, w, h, o.r ?? 16); ctx.lineWidth = 2; ctx.strokeStyle = o.stroke || 'rgba(212,160,23,.55)'; ctx.stroke(); ctx.restore();
  if (o.label) pill(o.label, x + 22, y - 2, { font: '600 21px ' + SANS, h: 40, bg: 'rgba(11,10,15,.92)', alpha: o.alpha ?? 1 });
}
function dot(x, y, r, color, a = 1) { ctx.save(); ctx.globalAlpha *= a; const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, 7); ctx.fill(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore(); }
function source(s, a = 1) {   // wraps to at most two lines inside the safe width, always above the caption band
  ctx.save(); ctx.font = '20px ' + SANS; const words = s.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > 1680 && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); ctx.restore();
  const shown = lines.slice(0, 2), y0 = shown.length === 2 ? 872 : 896;
  shown.forEach((l, i) => txt(l, 120, y0 + i * 26, { font: '20px ' + SANS, color: C.soft, alpha: a * .95 }));
}

function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const gx = W * (0.5 + 0.18 * Math.sin(t * 0.05)), g = ctx.createRadialGradient(gx, -120, 0, gx, -120, 1100);
  g.addColorStop(0, 'rgba(212,160,23,.13)'); g.addColorStop(1, 'rgba(212,160,23,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); } ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function chrome(t) {
  const p2 = t >= TL.partTwoAt - 0.3;
  txt('◊', 120, 78, { font: '34px ' + SERIF, color: C.gold });
  txt('AI Native Solutions', 160, 76, { font: 'bold 26px ' + SERIF, color: C.ink });
  txt(p2 ? 'PART TWO · THE ESTATE' : 'PART ONE · FALLFORGE MINT', W - 120, 76, { font: '600 20px ' + SANS, color: C.soft, align: 'right' });
}
let NOCAP = q.has('nocap');
function captions(t) {
  if (NOCAP) return;
  for (const s of TL.scenes) for (const c of s.captions) if (t >= c.start && t < c.end) {
    const a = Math.min(seg(t, c.start, c.start + 0.12), 1 - seg(t, c.end - 0.12, c.end));
    ctx.save(); ctx.globalAlpha = a; ctx.font = '38px ' + SERIF; const w = Math.min(1640, ctx.measureText(c.text).width + 80);
    rr(W / 2 - w / 2, 930, w, 78, 14); ctx.fillStyle = 'rgba(8,7,11,.82)'; ctx.fill(); ctx.strokeStyle = 'rgba(212,160,23,.25)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    txt(c.text, W / 2, 981, { font: '38px ' + SERIF, align: 'center', alpha: a, color: C.ink });
  }
  if (!q.has('still')) { ctx.fillStyle = 'rgba(212,160,23,.55)'; ctx.fillRect(0, H - 4, W * (t / TL.duration), 4); }
}

// ── the scenes (lt = seconds into the scene, d = scene length) ───────────────────────────────────
const S = {};
S.bill = (lt, d) => {
  eyebrow('The bill', 120, 190, eo(seg(lt, .1, .6)));
  txt('One small job.', 120, 290, { font: '72px ' + SERIF, alpha: eo(seg(lt, .2, .8)) });
  txt('A giant model, rented by the token.', 120, 372, { font: '52px ' + SERIF, color: C.gold, alpha: eo(seg(lt, .6, 1.2)) });
  const cx = 1330, cy = 520, R = 250 + 8 * Math.sin(lt * 2.2), a = eo(seg(lt, .3, 1.2));
  ctx.save(); ctx.globalAlpha = a; const g = ctx.createRadialGradient(cx - 80, cy - 90, 20, cx, cy, R); g.addColorStop(0, '#3a3140'); g.addColorStop(1, '#141118');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(226,217,200,.18)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  txt('RENTED FRONTIER MODEL', cx, cy + 8, { font: '600 26px ' + SANS, color: C.soft, align: 'center', alpha: a });
  for (let k = 0; k < 12; k++) { const ang = lt * .5 + k * Math.PI / 6; txt('per token', cx + Math.cos(ang) * (R + 58), cy + Math.sin(ang) * (R + 58) + 8, { font: '19px ' + MONO, color: C.gold, align: 'center', alpha: a * .55 }); }
  for (let k = 0; k < 5; k++) { const p = ((lt * .55 + k / 5) % 1); if (lt < .8) continue; const x = lerp(170, cx - R + 30, eio(p)), s = lerp(1, .35, p);
    ctx.save(); ctx.globalAlpha = (1 - p) * .95; ctx.translate(x, 640); ctx.scale(s, s); card(-150, -44, 300, 88, { r: 12 }); txt('classify a ticket', 0, 9, { font: '26px ' + SANS, align: 'center' }); ctx.restore(); }
  txt('billed per token · every month · for the same small job', cx, cy + R + 118, { font: '24px ' + SANS, color: C.soft, align: 'center', alpha: a });
};
S.argument = (lt) => {
  eyebrow('The AI-bill argument', W / 2 - 150, 200, eo(seg(lt, .1, .5)));
  const a1 = eo(seg(lt, .15, .75)), a2 = eo(seg(lt, .8, 1.4));
  card(lerp(40, 160, a1), 290, 760, 420, { alpha: a1, glow: 'rgba(212,160,23,.12)' });
  txt('THE ENGINEERING LEAD', lerp(90, 210, a1), 370, { font: '600 22px ' + SANS, color: C.soft, alpha: a1 });
  txt('“Prove it', lerp(90, 210, a1), 490, { font: '84px ' + SERIF, alpha: a1 }); txt('won’t break.”', lerp(90, 210, a1), 590, { font: '84px ' + SERIF, alpha: a1 });
  card(lerp(1120, 1000, a2), 290, 760, 420, { alpha: a2, glow: 'rgba(212,160,23,.12)', stroke: 'rgba(212,160,23,.6)' });
  txt('THE CFO', lerp(1170, 1050, a2), 370, { font: '600 22px ' + SANS, color: C.soft, alpha: a2 });
  txt('“Get the bill', lerp(1170, 1050, a2), 490, { font: '84px ' + SERIF, color: C.gold, alpha: a2 }); txt('down.”', lerp(1170, 1050, a2), 590, { font: '84px ' + SERIF, color: C.gold, alpha: a2 });
  txt('Both want a receipt they can check.', W / 2, 800, { font: 'italic 34px ' + SERIF, color: C.soft, align: 'center', alpha: eo(seg(lt, 2.2, 2.8)) });
};
const LADDER = [['~1B', 1.2, 'Llama 3.2 1B'], ['~3–4B', 3.5, 'Llama 3.2 3B'], ['~7–8B', 8, 'Llama 3.1 8B'], ['~12–14B', 14.7, 'Phi-4 14B'], ['~32B', 32.5, 'Qwen2.5-Coder 32B'], ['~70B', 70, 'Llama 3.3 70B'], ['~100–200B', 141, 'Mixtral 8x22B (MoE)']];
function ladder(lt, x0, y0, rowH, o = {}) {
  LADDER.forEach(([band, p, name], i) => {
    const y = y0 + (LADDER.length - 1 - i) * rowH, a = eo(seg(lt, .2 + i * .12, .7 + i * .12)), w = 90 + Math.log10(p * 10) / Math.log10(1410) * 470;
    const hit = o.hit === i;
    txt(band, x0, y + 12, { font: (hit ? 'bold ' : '') + '26px ' + MONO, color: hit ? C.gold2 : C.soft, alpha: a });
    ctx.save(); ctx.globalAlpha = a; rr(x0 + 190, y - 20, w * eo(seg(lt, .3 + i * .12, 1 + i * .12)), 40, 8);
    const g = ctx.createLinearGradient(x0 + 190, 0, x0 + 190 + w, 0); g.addColorStop(0, hit ? C.gold : '#2a2530'); g.addColorStop(1, hit ? C.gold2 : '#1d1a22'); ctx.fillStyle = g; ctx.fill();
    if (hit) { ctx.shadowColor = 'rgba(255,182,72,.6)'; ctx.shadowBlur = 30; ctx.strokeStyle = C.gold2; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
    txt(name, x0 + 210 + w, y + 10, { font: (hit ? '600 ' : '') + '25px ' + SANS, color: hit ? C.ink : C.soft, alpha: a });
  });
}
S.sizer = (lt, d) => {
  eyebrow('01 · Size it', 120, 176, eo(seg(lt, .1, .5)));
  txt('The smallest model that should clear your bar.', 120, 250, { font: '56px ' + SERIF, alpha: eo(seg(lt, .15, .7)) });
  const inShot = seg(lt, 7.0, 7.8);
  ctx.save(); ctx.globalAlpha = 1 - inShot * .75;
  const jobB = lt > 4.6; const hitA = lt > 3.0 && !jobB, hitB = lt > 5.7;
  ladder(lt, 150, 330, 76, { hit: hitB ? 5 : (hitA ? 0 : -1) });
  const ja = eo(seg(lt, 2.0, 2.5));
  if (!jobB) { pill('job: classify a ticket · answer: a short label', 1250, 330, { alpha: ja, font: '500 23px ' + SANS });
    if (hitA) { const b = eo(seg(lt, 3.0, 3.5)); pill('task: classify → rung 0', 1250, 420, { alpha: b, color: C.soft, bg: 'rgba(143,135,120,.08)', font: '22px ' + MONO }); pill('shape: short label → −1 (floor)', 1250, 480, { alpha: eo(seg(lt, 3.3, 3.8)), color: C.soft, bg: 'rgba(143,135,120,.08)', font: '22px ' + MONO });
      pill('Start with Llama 3.2 1B', 1250, 575, { alpha: eo(seg(lt, 3.7, 4.2)), color: C.good, bg: 'rgba(95,191,127,.12)', font: '600 28px ' + SANS, h: 58 }); } }
  else { pill('job: write code · strict · on a GPU box', 1250, 330, { alpha: eo(seg(lt, 4.6, 5.1)), font: '500 23px ' + SANS });
    if (hitB) { pill('task: code → rung 4', 1250, 420, { alpha: eo(seg(lt, 5.7, 6.1)), color: C.soft, bg: 'rgba(143,135,120,.08)', font: '22px ' + MONO }); pill('quality: strict → +1', 1250, 480, { alpha: eo(seg(lt, 5.9, 6.3)), color: C.soft, bg: 'rgba(143,135,120,.08)', font: '22px ' + MONO });
      pill('Start with Llama 3.3 70B', 1250, 575, { alpha: eo(seg(lt, 6.1, 6.5)), color: C.good, bg: 'rgba(95,191,127,.12)', font: '600 28px ' + SANS, h: 58 }); } }
  txt('Never an upsell — a 1B answer says 1B.', 1250, 680, { font: 'italic 30px ' + SERIF, color: C.gold, alpha: eo(seg(lt, 4.0, 4.5)) * (1 - seg(lt, 6.8, 7.1)) });
  ctx.restore();
  if (inShot > 0) { const z = lerp(1.0, 1.08, seg(lt, 7.0, d)); shot('fallforgemint-sizer', lerp(1900, 470, eo(inShot)), 300, 1300, 540, { zoom: z, px: .05, py: .15, label: 'Live now · fallforgemint', alpha: inShot });
    txt('A transparent heuristic starting point — the proof is the scorecard.', 120, 894, { font: '21px ' + SANS, color: C.soft, alpha: inShot }); }
};
S.prove = (lt, d) => {
  eyebrow('02 · Mint it, then prove it', 120, 176, eo(seg(lt, .1, .5)));
  txt('It tries to beat the base — and can say you lost.', 120, 250, { font: '52px ' + SERIF, alpha: eo(seg(lt, .15, .7)) });

  const exA = eo(seg(lt, .3, .9));
  for (let i = 0; i < 5; i++) { const toSpec = i < 3, m = eio(seg(lt, 1.0 + i * .12, 1.9 + i * .12)); const sx = 140 + i * 18, sy = 330 + i * 16;
    const tx = toSpec ? 170 + i * 150 : 190 + (i - 3) * 150, ty = toSpec ? 560 : 770;
    ctx.save(); ctx.globalAlpha = exA; card(lerp(sx, tx, m), lerp(sy, ty - 34, m), 130, 68, { r: 10, stroke: toSpec ? 'rgba(212,160,23,.5)' : 'rgba(95,191,127,.5)' });
    txt('example ' + (i + 1), lerp(sx, tx, m) + 65, lerp(sy, ty - 34, m) + 42, { font: '20px ' + SANS, color: C.soft, align: 'center' }); ctx.restore(); }

  const fill = eo(seg(lt, 2.8, 4.2));
  const bar = (label, v, max, y, col) => { txt(label, 860, y, { font: '26px ' + MONO, color: C.ink, alpha: ra }); ctx.save(); ctx.globalAlpha = ra; rr(860, y + 16, 680, 30, 8); ctx.fillStyle = '#1d1a22'; ctx.fill(); rr(860, y + 16, 680 * (v / max) * fill, 30, 8); ctx.fillStyle = col; ctx.fill(); ctx.restore();
    txt(Math.round(v * fill) + '/' + max, 1560, y + 42, { font: 'bold 28px ' + MONO, color: col, alpha: ra }); };
  bar('base · llama3.2:1b', r.vsBase.base, r.probes, 440, C.soft);
  bar('yours · review-1b', r.vsBase.node, r.probes, 530, C.gold2);
  pill('BEATS its base — passed its gate', 860, 650, { alpha: eo(seg(lt, 4.2, 4.6)), color: C.good, bg: 'rgba(95,191,127,.12)', font: '600 26px ' + SANS, h: 54 });
  const lo = eo(seg(lt, 5.2, 5.7));
  txt('vs qwen2.5:7b — a model ~7× its size: ' + r.vsBigger.other + '/' + r.probes, 860, 735, { font: '24px ' + MONO, color: C.soft, alpha: lo });
  pill('LOSES — and the receipt says so', 1300, 650, { alpha: lo, color: C.bad, bg: 'rgba(224,106,95,.12)', font: '600 24px ' + SANS, h: 54 });
  source('fallforgemint · shipped receipts receipt-vs-base.json + receipt-vs-qwen.json · Ed25519-signed manifest, verified in CI', eo(seg(lt, 2.5, 3)));
};
S.receipt = (lt, d) => {

  txt('A scorecard anyone can check.', 120, 250, { font: '56px ' + SERIF, alpha: eo(seg(lt, .15, .7)) });
  card(120, 300, 900, 540, { glow: 'rgba(212,160,23,.1)', alpha: eo(seg(lt, .2, .6)) });
  const rows = [['kind', 'fallforgemint-scorecard', C.ink], ['verdict', 'BEATS | LOSES | TIES', C.good], ['keyClass', 'software-ed25519', C.ink], ['held-out', 'hash-disjoint ✓', C.good], ['rerun', 'a real CI run — link bound ✓', C.good], ['hash', 'sha-256 over every field above', C.soft]];
  rows.forEach(([k, v, col], i) => { const a = eo(seg(lt, .5 + i * .28, .9 + i * .28)); txt(k, 170, 372 + i * 54, { font: '27px ' + MONO, color: C.soft, alpha: a }); txt(v, 380, 372 + i * 54, { font: '27px ' + MONO, color: col, alpha: a }); });
  wrap('“' + F.forgemint.heldOutClaim + '”', 170, 736, 800, 40, { font: 'italic 28px ' + SERIF, color: C.gold, alpha: eo(seg(lt, 2.4, 3.0)) });

// ── deterministic encode: every frame drawn at exact t = i/30, H.264 + AAC via WebCodecs ──────────
window.runEncode = async (bitrate = 4_000_000) => {
  const N = Math.round(TL.duration * FPS); let vDesc = null, aDesc = null, batch = [], bytes = 0;
  const flush = async () => { if (batch.length) { const out = batch; batch = []; bytes = 0; await window.__push(JSON.stringify(out)); } };   // detach BEFORE awaiting: chunks emitted during the await must land in the new batch, not be wiped
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const venc = new VideoEncoder({ output: (chunk, meta) => { if (meta && meta.decoderConfig && meta.decoderConfig.description && !vDesc) vDesc = b64(new Uint8Array(meta.decoderConfig.description)); const u = new Uint8Array(chunk.byteLength); chunk.copyTo(u); batch.push(['v', b64(u), chunk.timestamp, chunk.type === 'key' ? 1 : 0]); bytes += u.length; }, error: (e) => { window.__err = String(e); } });
  venc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate, bitrateMode: 'variable', framerate: FPS, avc: { format: 'avc' }, latencyMode: 'quality', hardwareAcceleration: 'prefer-software' });
  for (let i = 0; i < N; i++) {
    draw(i / FPS);
    const f = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(f, { keyFrame: i % (FPS * 2) === 0 }); f.close();
    while (venc.encodeQueueSize > 2) await new Promise(r => setTimeout(r, 1));
    if (bytes > 2e6) await flush();
    if (i % 150 === 0) await window.__progress(i, N);
  }
  await venc.flush(); await flush();
  // audio: parse our own 16-bit PCM WAV (no resampling), AAC-LC 48 kHz mono
  const buf = new Uint8Array(await (await fetch('out/film-audio.wav')).arrayBuffer()), dv = new DataView(buf.buffer);
  let o = 12, dataOff = 0, dataLen = 0; while (o < buf.length) { const id = String.fromCharCode(...buf.subarray(o, o + 4)), sz = dv.getUint32(o + 4, true); if (id === 'data') { dataOff = o + 8; dataLen = sz; break; } o += 8 + sz + (sz & 1); }
  const n = dataLen / 2, pcm = new Float32Array(n); for (let i = 0; i < n; i++) pcm[i] = dv.getInt16(dataOff + i * 2, true) / 32768;
  const aenc = new AudioEncoder({ output: (chunk, meta) => { if (meta && meta.decoderConfig && meta.decoderConfig.description && !aDesc) aDesc = b64(new Uint8Array(meta.decoderConfig.description)); const u = new Uint8Array(chunk.byteLength); chunk.copyTo(u); batch.push(['a', b64(u), chunk.timestamp, 1]); }, error: (e) => { window.__err = String(e); } });
  aenc.configure({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 1, bitrate: 128000 });
  const BLK = 4800; for (let i = 0; i < n; i += BLK) { const part = pcm.subarray(i, Math.min(n, i + BLK)); aenc.encode(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: part.length, numberOfChannels: 1, timestamp: Math.round(i * 1e6 / 48000), data: part })); }
  await aenc.flush(); await flush();
  return { frames: N, vDesc, aDesc, err: window.__err || null };
};
